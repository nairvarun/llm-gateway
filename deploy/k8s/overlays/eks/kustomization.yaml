# K1 on EKS Auto Mode: the k1 overlay plus the ECR image, Auto Mode's ALB over HTTPS only,
# and amd64 nodes. Prerequisites: terraform in infra/eks, then deploy/k8s/cluster/eks-auto.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../k1
images:
  - name: llm-gateway
    # Set to the ecr_repository_url terraform output and the tag you pushed.
    newName: 365712037872.dkr.ecr.ap-south-1.amazonaws.com/llm-gateway
    newTag: "0.2.0"
patches:
  - target: {kind: Deployment, name: gateway}
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value: {kubernetes.io/arch: amd64}   # the image is built for linux/amd64
  - target: {kind: Ingress, name: gateway}
    patch: |-
      - op: add
        path: /spec/ingressClassName
        value: alb
      - op: add
        path: /spec/rules/0/host
        value: lmgate.nairvarun.com
      - op: replace
        path: /metadata/annotations
        value:
          alb.ingress.kubernetes.io/target-type: ip
          # The ALB must probe readiness, not "/" (which is a 404 here).
          alb.ingress.kubernetes.io/healthcheck-path: /readyz
          # HTTPS only: no port 80 listener, so a key is never sent in the clear by mistake.
          alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS": 443}]'
          # Set to the certificate_arn terraform output (issued once the DNS record exists).
          alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-south-1:365712037872:certificate/9a326c1a-eee8-44e9-a851-53e00870b418
          alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
          # Streams can last up to timeouts.total_s (300 s): keep the ALB from cutting them,
          # and let draining targets finish in-flight streams.
          alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=330
          alb.ingress.kubernetes.io/target-group-attributes: deregistration_delay.timeout_seconds=330
          # Apps call the gateway from anywhere; TLS plus virtual keys protect it. Narrow this if
          # every caller has a known address.
          alb.ingress.kubernetes.io/inbound-cidrs: 0.0.0.0/0
          # No alb.ingress.kubernetes.io/tags: AmazonEKSLoadBalancingPolicy only allows EKS's own
          # tag keys on CreateRule, so custom tags make the listener rule fail with AccessDenied.
