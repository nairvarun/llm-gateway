# Gateway configuration. Mounted from a ConfigMap; secrets come from environment variables.
# Model IDs and prices verified against the providers' docs on 2026-10-12 and exercised live; re-check before relying on them.

providers:
  openai:
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
  anthropic:
    base_url: https://api.anthropic.com
    api_key_env: ANTHROPIC_API_KEY
    default_max_tokens: 1024

models:                       # client-facing aliases; first target is primary
  fast:
    targets:
      - {provider: openai, model: gpt-6-luna}
      - {provider: anthropic, model: claude-haiku-5-5}
  smart:
    targets:
      - {provider: anthropic, model: claude-sonnet-5-5}

pricing:                      # USD per 1M tokens, keyed by provider model ID
  gpt-6-luna: {input: 0.10, output: 0.50}
  claude-haiku-5-5: {input: 0.10, output: 0.50}   # prompts up to 100k tokens; 0.50/2.50 above
  claude-sonnet-5-5: {input: 2.00, output: 10.00}

stages:
  cache: {enabled: true, max_entries: 1000, ttl_s: 300}
  budget: {enabled: true}

timeouts:
  connect_s: 3
  first_byte_s: 20            # request sent -> first chunk (or full body)
  idle_s: 30                  # max gap between chunks once streaming
  total_s: 300                # hard ceiling for any single request

retries:
  max_attempts: 3             # retries and fallbacks combined
  backoff_base_s: 0.25        # full jitter: sleep uniform(0, base * 2**n)

breaker:
  failure_threshold: 5
  open_s: 30

shutdown:
  drain_s: 330                # >= timeouts.total_s
  drain_delay_s: 10           # /internal/drain waits this long for the ingress to catch up
