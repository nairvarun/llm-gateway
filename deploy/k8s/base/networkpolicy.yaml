# Vanilla NetworkPolicy cannot match hostnames, so egress is limited to DNS and TCP 443
# (spec D11). Hostname-level rules would need an FQDN-aware CNI such as Cilium.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - {port: 8080, protocol: TCP}
  egress:
    - ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    - ports:
        - {port: 443, protocol: TCP}
