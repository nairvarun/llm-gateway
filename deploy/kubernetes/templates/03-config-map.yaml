apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-runtime
  namespace: __KUBERNETES_NAMESPACE__
data:
  GATEWAY_PROVIDER: mock
  GATEWAY_DATABASE_URL_FILE: /mnt/secrets-store/database-url
  GATEWAY_REPLAY_ENCRYPTION_KEY_FILE: /mnt/secrets-store/replay-key
  GATEWAY_CACHE_ENCRYPTION_KEY_FILE: /mnt/secrets-store/cache-key
  GATEWAY_INPUT_HASH_KEY_FILE: /mnt/secrets-store/input-hash-key
  GATEWAY_TLS_CERT_FILE: /mnt/secrets-store/tls-cert
  GATEWAY_TLS_KEY_FILE: /mnt/secrets-store/tls-key
  GATEWAY_REDIS_URL: __REDIS_URL__
  GATEWAY_CACHE_REDIS_URL: __REDIS_URL__
  GATEWAY_REPLAY_RETENTION_HOURS: "24"
  GATEWAY_CACHE_TTL_SECONDS: "3600"
  GATEWAY_METADATA_RETENTION_DAYS: "30"
