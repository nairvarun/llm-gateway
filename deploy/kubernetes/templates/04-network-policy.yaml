apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-default-deny
  namespace: __KUBERNETES_NAMESPACE__
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-runtime
  namespace: __KUBERNETES_NAMESPACE__
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: gateway
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: __KUBERNETES_NAMESPACE__
          podSelector:
            matchLabels:
              app.kubernetes.io/name: gateway-smoke
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - ipBlock:
            cidr: __VPC_CIDR__
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6379
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-smoke-client
  namespace: __KUBERNETES_NAMESPACE__
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: gateway-smoke
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: gateway
              app.kubernetes.io/component: api
      ports:
        - protocol: TCP
          port: 8000
    - to:
        - ipBlock:
            cidr: __VPC_CIDR__
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 5432
    - to:
        - ipBlock:
            cidr: __VPC_CIDR__
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
