apiVersion: batch/v1
kind: Job
metadata:
  name: gateway-migrate
  namespace: __KUBERNETES_NAMESPACE__
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/component: migration
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      serviceAccountName: gateway
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: __IMAGE_URI__
          imagePullPolicy: IfNotPresent
          command: ["sh", "-ec"]
          args:
            - gateway wait-database --timeout 60 && alembic upgrade head
          envFrom:
            - configMapRef:
                name: gateway-runtime
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: runtime-secrets
              mountPath: /mnt/secrets-store
              readOnly: true
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: runtime-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: gateway-runtime
        - name: temporary
          emptyDir: {}
