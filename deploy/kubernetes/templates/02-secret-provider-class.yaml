apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: gateway-runtime
  namespace: __KUBERNETES_NAMESPACE__
spec:
  provider: aws
  parameters:
    region: __AWS_REGION__
    usePodIdentity: "true"
    objects: |
      - objectName: __DATABASE_SECRET_NAME__
        objectType: secretsmanager
        objectAlias: database-url
      - objectName: __REPLAY_SECRET_NAME__
        objectType: secretsmanager
        objectAlias: replay-key
      - objectName: __CACHE_SECRET_NAME__
        objectType: secretsmanager
        objectAlias: cache-key
      - objectName: __INPUT_HASH_SECRET_NAME__
        objectType: secretsmanager
        objectAlias: input-hash-key
      - objectName: __TLS_CERT_SECRET_NAME__
        objectType: secretsmanager
        objectAlias: tls-cert
      - objectName: __TLS_KEY_SECRET_NAME__
        objectType: secretsmanager
        objectAlias: tls-key
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: gateway-smoke
  namespace: __KUBERNETES_NAMESPACE__
spec:
  provider: aws
  parameters:
    region: __AWS_REGION__
    usePodIdentity: "true"
    objects: |
      - objectName: __DATABASE_SECRET_NAME__
        objectType: secretsmanager
        objectAlias: database-url
      - objectName: __SMOKE_CLIENT_SECRET_NAME__
        objectType: secretsmanager
        objectAlias: client-key
      - objectName: __TLS_CERT_SECRET_NAME__
        objectType: secretsmanager
        objectAlias: tls-cert
