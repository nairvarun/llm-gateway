# Prometheus alerting rules (plain rules file; wrap in a PrometheusRule if you use the operator).
groups:
  - name: llm-gateway
    rules:
      - alert: GatewayHighErrorRate
        # 5xx share of all requests, excluding client disconnects (status_class="499").
        expr: |
          sum(rate(gateway_requests_total{status_class="5xx"}[5m]))
            / clamp_min(sum(rate(gateway_requests_total[5m])), 1e-9) > 0.05
        for: 10m
        labels: {severity: page}
        annotations:
          summary: "More than 5% of gateway requests fail with 5xx"
          description: "Check gateway_breaker_state and gateway_upstream_attempts_total by provider."
      - alert: GatewayHighTTFT
        expr: |
          histogram_quantile(0.95,
            sum by (le, alias) (rate(gateway_ttft_seconds_bucket[5m]))) > 5
        for: 15m
        labels: {severity: ticket}
        annotations:
          summary: "p95 time to first byte above 5 s for {{ $labels.alias }}"
