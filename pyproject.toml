[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "llm-reliability-gateway"
version = "0.1.0"
description = "Offline-first provider-neutral LLM gateway with fixture-tested routing"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic-settings>=2.8,<3",
  "sqlalchemy[asyncio]>=2.0.40,<2.1",
  "asyncpg>=0.30,<1",
  "alembic>=1.15,<2",
  "jsonschema>=4.23,<5",
  "redis>=5.2,<7",
  "openai==3.16.2",
  "anthropic==1.7.0",
  "cryptography>=50,<51",
  "opentelemetry-sdk>=1.38,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.38,<2",
  "prometheus-client>=0.23,<1",
]

[project.scripts]
gateway = "app.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "httpx>=0.28,<1",
  "ruff>=0.11,<1",
  "mypy>=1.15,<2",
  "types-jsonschema>=4.23",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "migrations", "tests", "deploy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: requires a running local PostgreSQL server"]
addopts = "-ra"
