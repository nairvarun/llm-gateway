name: llm-gateway-foundation

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: gateway
    ports:
      - "127.0.0.1:${GATEWAY_POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway"]
      interval: 2s
      timeout: 2s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${GATEWAY_REDIS_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 2s
      timeout: 2s
      retries: 20

  gateway:
    build: .
    image: llm-gateway-foundation:local
    environment:
      GATEWAY_PROVIDER: mock
      GATEWAY_DATABASE_URL: postgresql+asyncpg://gateway:local-development-only@postgres:5432/gateway
      GATEWAY_REDIS_URL: redis://redis:6379
      GATEWAY_REPLAY_ENCRYPTION_KEY: ${GATEWAY_REPLAY_ENCRYPTION_KEY:-}
      GATEWAY_MOCK_SCENARIO: ${GATEWAY_MOCK_SCENARIO:-success}
    ports:
      - "127.0.0.1:${GATEWAY_HTTP_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
